volumes:
  postgres_storage:
  ollama_storage:
  qdrant_storage:

x-n8n: &service-n8n
  image: n8nio/n8n:latest
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_SECURE_COOKIE=false
    - N8N_ENCRYPTION_KEY
    - N8N_USER_MANAGEMENT_JWT_SECRET
    - OLLAMA_HOST=${OLLAMA_HOST:-ollama:11434}
  env_file:
    - path: .env
      required: true

x-ollama: &service-ollama
  image: ollama/ollama:latest
  container_name: ollama
  restart: unless-stopped
  ports:
    - 11434:11434
  volumes:
    - ollama_storage:/root/.ollama

x-init-ollama: &init-ollama
  image: ollama/ollama:latest
  container_name: ollama-pull-llama
  volumes:
    - ollama_storage:/root/.ollama
  entrypoint: /bin/sh
  environment:
    - OLLAMA_HOST=ollama:11434
  command:
    - "-c"
    - "sleep 3; ollama pull llama3.2"

services:

  napkin-exchange-proxy:

    container_name: napkin-exchange-proxy

    image: nginxproxy/nginx-proxy

    restart: unless-stopped

    ports:

      - 80:80

      - 443:443

    volumes:

      - /var/run/docker.sock:/tmp/docker.sock:ro

      - /var/docker/nginx/html:/usr/share/nginx/html

      - /var/docker/nginx/certs:/etc/nginx/certs

      - /var/docker/nginx/vhost:/etc/nginx/vhost.d

    logging:

      options:

        max-size: "10m"

        max-file: "3"

  napkin-exchange-letsencrypt:

    container_name: napkin-exchange-letsencrypt

    image: jrcs/letsencrypt-nginx-proxy-companion

    restart: unless-stopped

    volumes_from:

      - napkin-exchange-proxy

    volumes:

      - /var/run/docker.sock:/var/run/docker.sock

      - /var/docker/nginx/acme:/etc/acme.sh

    environment:

      DEFAULT_EMAIL: troy@softwareshinobi.com
   
   ####################################
   ###
   ###
   ####################################
   
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n-import:
    <<: *service-n8n
    hostname: n8n-import
    container_name: n8n-import
    entrypoint: /bin/sh
    command:
    - "-c"
    - |
      if [ -z "$(n8n list:workflow --onlyId)" ]; then
        n8n import:credentials --separate --input=/demo-data/credentials && \
        n8n import:workflow --separate --input=/demo-data/workflows
      else
        echo "Workflows exist, skipping import"
      fi
    volumes:
      - ./n8n/demo-data:/demo-data
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    <<: *service-n8n
    hostname: n8n
    container_name: n8n
    user: "1000:1000"  # <--- Runs container process as root
    restart: unless-stopped
    ports:
      - 5678:5678
    volumes:
      - ./data/node:/home/node/.n8n
      - ./data/demo:/demo-data
      - ./data/shared:/data/shared
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully
    expose:
    
      - 5678
      
    environment:
      
      WEBHOOK_URL: https://automation.embanet.online/
      
      VIRTUAL_PORT: 5678
      
      VIRTUAL_HOST: automation.embanet.online
      
      LETSENCRYPT_HOST: automation.embanet.online        
      
      N8N_DIAGNOSTICS_ENABLED: false
      
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true
      
  qdrant:
    image: qdrant/qdrant
    hostname: qdrant
    container_name: qdrant
    restart: unless-stopped
    ports:
      - 6333:6333
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama-cpu:
    profiles: ["cpu"]
    <<: *service-ollama

  ollama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *service-ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *service-ollama
    image: ollama/ollama:rocm
    devices:
      - "/dev/kfd"
      - "/dev/dri"

  ollama-pull-llama-cpu:
    profiles: ["cpu"]
    <<: *init-ollama
    depends_on:
      - ollama-cpu

  ollama-pull-llama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *init-ollama
    depends_on:
      - ollama-gpu

  ollama-pull-llama-gpu-amd:
    profiles: [gpu-amd]
    <<: *init-ollama
    image: ollama/ollama:rocm
    depends_on:
     - ollama-gpu-amd
